[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuraneunet"
version = "0.1.0"
description = "Validated public utilities for NeurAneuNet research workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zhihong Wen" }]
dependencies = []

[tool.setuptools.packages.find]
include = ["neuraneunet*"]
